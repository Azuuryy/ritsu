# Announce published GitHub releases in a Discord channel.
#
# This workflow sends external messages: it requires the DISCORD_WEBHOOK_URL
# repository secret. See artifacts/README.md ("Announce on Discord").
#
# Automatic runs use the release payload. Manual runs take a release tag and
# fetch the title, notes and URL from the API, so the markdown keeps its line
# breaks instead of being flattened by a single-line workflow input.
#
# Pinned to github-releases-to-discord v1.20.0 (tag v1); update this SHA
# deliberately after reviewing the release notes.
# https://github.com/SethCohen/github-releases-to-discord

name: Announce releases on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > release.json
          name=$(jq -r 'if (.name // "") == "" then .tag_name else .name end' release.json)
          delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "name<<$delimiter"
            echo "$name"
            echo "$delimiter"
            echo "body<<$delimiter"
            jq -r '.body // ""' release.json
            echo "$delimiter"
            echo "url=$(jq -r '.html_url' release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Post the release announcement
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: Ritsu
          color: "2105893"
          footer_title: "Ritsu — release notes"
          footer_timestamp: true
          reduce_headings: true
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
