[package]
name = "ritsu-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "sqlx-postgres", "with-json", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde"] }
utoipa = { version = "6", features = ["uuid"] }
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }
